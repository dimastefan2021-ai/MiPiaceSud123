<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="utf-8">
    <title id="pageTitle">Produs — Pizzeria Mi Piace</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="description" id="pageMeta" content="Detalii produs — Pizzeria Mi Piace">
    <link href="img/logo.png" rel="icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/product.css" rel="stylesheet">
</head>

<body>

    
    
    
    <div class="container-fluid top-bar bg-dark text-light px-0 wow fadeIn is-hidden" data-wow-delay="0.1s">
        <div class="row gx-0 align-items-center d-none d-lg-flex is-hidden">
            <div class="col-lg-6 px-5 text-start">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a class="small text-light text-decoration-none" href="index.html">Acasă</a></li>
                    <li class="breadcrumb-item"><a class="small text-light text-decoration-none" href="index.html#menu-section">Meniu</a></li>
                </ol>
            </div>
            <div class="col-lg-6 px-5 text-end">
                <small>Urmăriți-ne pe: </small>
                <div class="h-100 d-inline-flex align-items-center">
                    <a class="btn btn-square btn-outline-light rounded-circle me-2" href="https://www.instagram.com/dvdcontinental"><i class="fab fa-instagram"></i></a>
                    <a class="btn btn-square btn-outline-light rounded-circle me-2" href="https://www.facebook.com/pizza.cahul.md"><i class="fab fa-facebook-f"></i></a>
                </div>
            </div>
        </div>
    </div>

    <!-- ======= BARA DE NAVIGARE ======= -->
    <nav class="navbar navbar-expand-xl navbar-dark fixed-top py-xl-0 px-xl-5 wow fadeIn" data-wow-delay="0.1s">
        <a href="index.html" class="navbar-brand ms-4 ms-xl-0">
            <img src="img/Emblemă.png" alt="Logo" class="logo-custom">
        </a>
        <span class="navbar-brand-text-mobile d-xl-none">Mi Piace</span>
        <span class="lang-switcher-placeholder d-xl-none ms-auto me-2"></span>
        <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav mx-auto p-4 p-xl-0">
                <a href="index.html" class="nav-item nav-link" data-i18n="nav_home">Acasă</a>
                <a href="index.html#menu-section" class="nav-item nav-link active" data-i18n="nav_menu">Meniu</a>
                <a href="index.html#despre-section" class="nav-item nav-link" data-i18n="nav_about">Despre</a>
                <a href="contact.html" class="nav-item nav-link" data-i18n="nav_contacts">Contacte</a>
            </div>
            <span class="lang-switcher-placeholder d-none d-xl-inline-flex me-3"></span>
            <div class="d-none d-xl-flex">
                <a href="tel:0299 32 162" class="d-flex align-items-center text-decoration-none">
                    <div class="btn-sm-square bg-primary rounded-circle me-3">
                        <i class="fa fa-phone-alt text-white"></i>
                    </div>
                    <div class="ps-3">
                        <small class="text-primary mb-0" data-i18n="nav_phone_label">Numărul de telefon:</small>
                        <p class="text-light fs-5 mb-0">0299 32 162</p>
                    </div>
                </a>
            </div>
        </div>
    </nav>

    
    
    
    
    <!-- ======= PAGINA PRINCIPALĂ A PRODUSULUI ======= -->
    <div class="product-page-wrapper">
        <div class="product-inner">

            
            <nav class="product-breadcrumb" aria-label="breadcrumb">
                <a href="index.html" data-i18n="nav_home">Acasă</a>
                <span class="sep">›</span>
                <a href="index.html#menu-section" data-i18n="nav_menu">Meniu</a>
                <span class="sep">›</span>
                <span class="current" id="pdBreadcrumb" data-i18n="product_breadcrumb_loading">Se încarcă...</span>
            </nav>

            
            <div class="product-card" id="productCard">

                
                <!-- Ecran de încărcare – afișat până când Firebase returnează datele produsului -->
                <div id="productLoading" class="state-screen">
                    <i class="fas fa-spinner fa-spin fa-3x load-icon"></i>
                    <p class="mb-0" data-i18n="product_loading">Se încarcă detaliile produsului...</p>
                </div>

                
                <!-- Ecran de eroare – afișat dacă produsul nu a fost găsit -->
                <div id="productError" class="state-screen is-hidden">
                    <i class="fas fa-exclamation-triangle fa-3x product-error-icon"></i>
                    <h3 class="product-error-title" data-i18n="product_not_found">Produsul nu a fost găsit</h3>
                    <a href="index.html#menu-section" class="product-back-link" data-i18n="product_back">← Înapoi la meniu</a>
                </div>

                
                <!-- Panoul cu imaginea produsului -->
                <div class="product-img-panel is-hidden" id="productImgPanel">
                    <img id="pdImg" src="" alt="">
                </div>

                
                <!-- Panoul cu detaliile produsului: titlu, preț, descriere, selector cantitate -->
                <div class="product-details-panel is-hidden" id="productDetailsPanel">
                    <a href="index.html#menu-section" class="close-btn-fixed" id="btnClose" title="Înapoi la meniu" data-i18n-title="product_back">
                        <i class="fas fa-times"></i>
                    </a>
                    <span class="product-tag" id="pdCategory"></span>
                    <h1 class="product-name" id="pdName"></h1>

                    <div class="product-price-row">
                        <span class="product-price-val" id="pdPrice"></span>
                        <span class="product-price-cur" data-i18n="js_lei">lei</span>
                    </div>

                    <p class="product-desc" id="pdDesc"></p>

                    <hr class="pd-divider">

                    <div class="product-actions">
                        <div class="qty-box">
                            <button class="qty-btn" id="pdDec">−</button>
                            <span id="pdQty">1</span>
                            <button class="qty-btn" id="pdInc">+</button>
                        </div>
                        <button class="btn-add" id="pdAddBtn" data-i18n="js_add_to_cart">
                            <i class="fas fa-shopping-cart"></i> Adaugă în Coș
                        </button>
                    </div>

                    <div class="pd-notice">
                        <i class="fas fa-info-circle"></i>
                        <span data-i18n="product_notice">Comanda se păstrează când revii la meniu.</span>
                    </div>
                </div>

            </div>

        </div>
    </div>

    
    <!-- ======= BUTONUL PLUTITOR AL COȘULUI DE CUMPĂRĂTURI ======= -->
    <a href="index.html#menu-section" class="float-cart" title="Coș" id="pdCartBtn" data-i18n-title="cart_title">
        <i class="fas fa-shopping-cart"></i>
        <span class="float-cart-badge is-hidden" id="pdCartBadge">0</span>
    </a>

    
    <!-- ======= SCRIPTURI: FIREBASE, JQUERY, BOOTSTRAP, I18N, LOGICĂ PRODUS ======= -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="js/locales/ro.js"></script>
    <script src="js/locales/ru.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/product.js"></script>
</body>

</html>
